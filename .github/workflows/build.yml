#
# divaps4 only ships a Windows Qt build. Upstream split the Qt front end into
# shadps4-emu/shadps4-qtlauncher, so a Qt flavour is two binaries: the emulator and the
# launcher that drives it. Both are built here and packaged with the deployed Qt runtime.

name: Build divaps4 (Windows, Qt)

on:
  push:
    branches: [main]
    paths-ignore:
      - "documents/**"
      - "**/*.md"
      - ".github/workflows/build.yml"
  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  QT_LAUNCHER_REPO: shadps4-emu/shadps4-qtlauncher
  QT_LAUNCHER_REF: 811fb0319cea2e76f1fb8f89d22d67efdf45761a

jobs:
  get-info:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
    steps:
    - uses: actions/checkout@v6
    - name: Get date and git hash
      id: vars
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  windows-qt:
    runs-on: windows-2025
    needs: get-info
    timeout-minutes: 240
    steps:
    - name: Checkout divaps4
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.0
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        archives: qtbase qttools
        modules: qtmultimedia

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
          cache-name: ${{ runner.os }}-qt-cache-cmake-build
      with:
        # GitHub caches are immutable. Use a unique key per run, restoring the most recent
        # compatible cache so newly compiled objects (including changed source files) are saved.
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.run_id }}
        restore-keys: |
          ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Configure divaps4
      # LTO is deliberately off. It roughly doubles the wall clock time of this job and buys a few
      # percent at runtime, which is a bad trade for a fork that rebuilds on every fix. Turn it back
      # on only for tagged releases.
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=OFF -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build divaps4
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Checkout the Qt launcher
      uses: actions/checkout@v6
      with:
        repository: ${{ env.QT_LAUNCHER_REPO }}
        ref: ${{ env.QT_LAUNCHER_REF }}
        path: qtlauncher
        submodules: recursive

    - name: Point the launcher at divaps4.exe
      shell: bash
      run: |
        set -e
        file=qtlauncher/src/qt_gui/gui_settings.cpp
        grep -q 'exeName = "shadPS4.exe";' "$file"
        sed -i 's/exeName = "shadPS4.exe";/exeName = "divaps4.exe";/' "$file"
        grep -q 'exeName = "divaps4.exe";' "$file"

    - name: Configure Qt launcher
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/qtlauncher/build -S ${{github.workspace}}/qtlauncher -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_UPDATER=OFF -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build Qt launcher
      run: cmake --build ${{github.workspace}}/qtlauncher/build --config ${{env.BUILD_TYPE}} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force upload | Out-Null
        New-Item -ItemType Directory -Force upload/qtplugins | Out-Null
        Copy-Item build/divaps4.exe upload/
        Copy-Item qtlauncher/build/shadPS4QtLauncher.exe upload/
        Copy-Item qtlauncher/dist/qt.conf upload/
        windeployqt --plugindir upload/qtplugins --no-compiler-runtime --no-system-d3d-compiler --no-system-dxc-compiler --dir upload upload/shadPS4QtLauncher.exe
        $name = "divaps4-win64-qt-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
        Compress-Archive -Path upload/* -DestinationPath "$name.zip"

    - name: Upload Windows Qt artifact
      uses: actions/upload-artifact@v7
      with:
        name: divaps4-win64-qt-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: divaps4-win64-qt-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}.zip
        if-no-files-found: error
